<script>
    // Toggle discount/reward fields
    document.addEventListener('DOMContentLoaded', function () {
        const offerType = document.getElementById('offerType');
        const discountFields = document.querySelectorAll('.discount-field');
        const rewardFields = document.querySelectorAll('.reward-field');

        function toggleFields() {
            if (offerType.value === 'discount') {
                discountFields.forEach(f => f.classList.remove('d-none'));
                rewardFields.forEach(f => f.classList.add('d-none'));
            } else {
                discountFields.forEach(f => f.classList.add('d-none'));
                rewardFields.forEach(f => f.classList.remove('d-none'));
            }
        }

        offerType.addEventListener('change', toggleFields);
        toggleFields(); // initial state
    });
</script>
