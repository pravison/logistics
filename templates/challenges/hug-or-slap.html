{% extends 'store/main.html' %}
{% load static %}

{% block content %}
<style>
    :root { color-scheme: light dark; }

    body {
        background: var(--background-color, #fff);
        color: var(--text-color, #000);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 2rem 1rem;
    }

    @media (prefers-color-scheme: dark) {
        body { background: #121212; color: #fff; }
        .card, .leaderboard table { background-color: #1f1f1f; }
        .feedback-form textarea { background-color: #2a2a2a; color: #fff; }
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .card, .leaderboard { width: 100%; display: none; margin-bottom: 3rem; }
    .card.active, .leaderboard.active { display: block; }

    .card {
        border-radius: 1.5rem;
        box-shadow: 0 4px 25px rgba(255, 0, 102, 0.2);
        padding: 2rem;
        text-align: center;
    }

    .card img {
        border-radius: 1rem;
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        margin-bottom: 1rem;
    }

    .name {
        font-size: 1.8rem;
        font-weight: bold;
        margin-bottom: 1rem;
    }

    .reaction-buttons {
        display: flex;
        justify-content: space-around;
        margin-bottom: 0.5rem;
    }

    .reaction-buttons button {
        font-size: 2.5rem;
        background: none;
        border: none;
        cursor: pointer;
        transition: transform 0.3s ease;
    }

    .reaction-buttons button:hover { transform: scale(1.3); }
    .reaction-buttons button.animate { animation: bounce 0.4s ease; }

    @keyframes bounce {
        0% { transform: scale(1); }
        50% { transform: scale(1.5); }
        100% { transform: scale(1); }
    }

    .reaction-labels {
        display: flex;
        justify-content: space-around;
        font-size: 1rem;
        margin-bottom: 1.5rem;
        color: #888;
    }

    .results {
        font-size: 1.2rem;
        margin-bottom: 1.2rem;
        display: none;
    }

    .feedback-form {
        display: none;
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 2rem;
    }

    .feedback-form textarea {
        width: 100%;
        padding: 1rem;
        border-radius: 0.5rem;
        border: none;
    }

    .feedback-form button, .next-button {
        background-color: #ff007f;
        color: #fff;
        padding: 0.6rem 1.2rem;
        border: none;
        border-radius: 0.5rem;
        font-weight: bold;
        cursor: pointer;
    }

    .next-button { background-color: #5555ff; }

    .leaderboard h2 {
        text-align: center;
        margin-bottom: 1rem;
    }

    .leaderboard table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 1rem;
        overflow: hidden;
    }

    .leaderboard th, .leaderboard td {
        padding: 0.8rem;
        text-align: center;
        border-bottom: 1px solid #444;
    }

    .share-link {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.95rem;
    }

    .share-link a {
        text-decoration: underline;
        margin: 0 0.3rem;
    }

    .emoji-fall {
        position: fixed;
        top: 0;
        left: 0;
        font-size: 2rem;
        animation: fall 2s ease-out;
        pointer-events: none;
        z-index: 9999;
    }

    @keyframes fall {
        0% { transform: translateY(-50px); opacity: 1; }
        100% { transform: translateY(100vh); opacity: 0; }
    }
    @media screen and (max-width: 600px) {
    .card img {
        max-height: 200px;
    }

    .reaction-buttons button {
        font-size: 2rem;
    }

    .container {
        padding: 1rem;
    }

    .feedback-form textarea {
        font-size: 1rem;
    }
}

    /* Slide-in animation for leaderboard */
    .leaderboard-slide-in {
        animation: slideIn 0.6s ease forwards;
    }
    
    @keyframes slideIn {
        from { opacity: 0; transform: translateY(50px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .spinner {
        margin-left: 0.5rem;
    }
    .spinner::after {
        content: '';
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #fff;
        border-top: 2px solid #ff007f;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    .verdict-heading {
        font-size: 1.3rem;
        font-weight: bold;
        color: #ff007f;
        text-align: center;
        margin-bottom: 1rem;
    }
    
    .verdict-box {
        display: flex;
        justify-content: space-around;
        align-items: center;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
    }
    
    .verdict-column {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    
    .verdict-column .label {
        font-size: 1rem;
        color: #888;
        margin-bottom: 0.5rem;
    }
    
    .verdict-column .value {
        font-size: 2rem;
        font-weight: bold;
    }
    
    .verdict-column .value.hug {
        color: #4CAF50; /* Green */
    }
    
    .verdict-column .value.slap {
        color: #f44336; /* Red */
    }
    @media screen and (max-width: 500px) {
        .verdict-box {
            flex-direction: column;
            gap: 1rem;
        }
    
        .verdict-column .value {
            font-size: 1.5rem;
        }
    }

</style>

<div class="container">
    <div class="card active" id="politicianCard">
        <img src="{{ politician.imageUrl }}" alt="Politician Image">
        <div class="name">
            <p>Will You Hug or Slap {{ politician.name }}</p>
        </div>

        <div class="reaction-buttons">
            <button id="hugBtn" onclick="react('hug')">🤗</button>
            <button id="slapBtn" onclick="react('slap')">🖐️</button>
        </div>

        <div class="reaction-labels"><span>Hug</span><span>Slap</span></div>

        <div class="results" id="results">Waiting for your reaction...</div>

        <audio id="slapSound" src="{% static 'slap.mp3' %}" preload="auto"></audio>
        <audio id="awesomeSound" src="{% static 'child-saying-awesome.mp3' %}" preload="auto"></audio>

        <div class="feedback-form" id="feedbackForm">
            <textarea id="commentBox" rows="4" placeholder="Why did you choose that reaction?">{{ existing_comment }}</textarea>
            <button id="submitCommentBtn" onclick="submitComment()">
            <span class="btn-text">Submit Comment</span>
                <span class="spinner" style="display: none;">⏳</span>
            </button>
        </div>

        <button id="nextButton" class="next-button" onclick="loadNextPolitician()" >
        {% if next_politician %}Next 👉{% else %}See Analytics{% endif %}
        </button>
        
        <div class="share-link">
            📊 <a href="{% url 'analytics_page' %}">Who got the most hugs/slaps</a> |
            💬 <a href="{% url 'comment_wall' %}">Comments</a> |<br/>
            📣 <span style="color: blue">Share:</span>
            <a href="https://wa.me/?text={{ request.build_absolute_uri }}" target="_blank">WhatsApp</a> |
            <a href="https://www.facebook.com/sharer/sharer.php?u={{ request.build_absolute_uri }}" target="_blank">Facebook</a> |
            <a href="https://x.com/intent/tweet?url={{ request.build_absolute_uri }}" target="_blank">X</a> |
            <a href="#" onclick="navigator.clipboard.writeText('{{ request.build_absolute_uri }}'); alert('Link copied!'); return false;">Copy Link</a>
        </div>

    </div>
</div>
<script>
    const politicianId = "{{ politician.id }}";
    const feedbackForm = document.getElementById("feedbackForm");
    const resultsDiv = document.getElementById("results");
    const hugBtn = document.getElementById("hugBtn");
    const slapBtn = document.getElementById("slapBtn");
    const nextButton = document.getElementById("nextButton");
    const commentBox = document.getElementById("commentBox");

    // Preload next image
    {% if next_politician %}
        const preloadImg = new Image();
        preloadImg.src = "{{ next_politician.imageUrl }}";
    {% endif %}

    // Client-side vote lock
    const reactedKey = "reacted_" + politicianId;
    if (localStorage.getItem(reactedKey)) {
        hugBtn.disabled = true;
        slapBtn.disabled = true;
        feedbackForm.style.display = 'flex';
    }

    function disableReactions() {
        hugBtn.disabled = true;
        slapBtn.disabled = true;
        localStorage.setItem(reactedKey, "true");
    }

    function dropEmojis(type) {
        const emoji = type === 'hug' ? '🤗' : '😭 💧😭️';
        for (let i = 0; i < 20; i++) {
            const span = document.createElement("span");
            span.classList.add("emoji-fall");
            span.textContent = emoji;
            span.style.left = Math.random() * 100 + 'vw';
            span.style.fontSize = (Math.random() * 1.5 + 1) + "rem";
            document.body.appendChild(span);

            requestAnimationFrame(() => {
                span.style.animation = `fall ${1.5 + Math.random()}s ease-out`;
            });

            setTimeout(() => span.remove(), 3000);
        }
    }

    function react(type) {
        if (localStorage.getItem(reactedKey)) return alert("You already reacted.");

        disableReactions();

        const sound = type === 'hug'
            ? document.getElementById("awesomeSound")
            : document.getElementById("slapSound");

        sound.pause();
        sound.currentTime = 0;
        sound.play();

        dropEmojis(type);

        fetch("{% url 'record_reaction' %}", {
            method: "POST",
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                politician_id: politicianId,
                reaction: type,
                comment: ''
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.hug_percent !== undefined && data.slap_percent !== undefined) {
                resultsDiv.style.display = "block";
                resultsDiv.innerHTML = `
                    <h3 class="verdict-heading">📢 The Verdict is In!</h3>
                    <div class="verdict-box">
                        <div class="verdict-column">
                            <div class="label">🤗 Hug</div>
                            <div class="value hug">${data.hug_percent}%</div>
                        </div>
                        <div class="verdict-column">
                            <div class="label">🖐️ Slap</div>
                            <div class="value slap">${data.slap_percent}%</div>
                        </div>
                    </div>
                `;
                feedbackForm.dataset.reaction = type;
                feedbackForm.style.display = 'flex';
            } else {
                alert("Error: Couldn't get reaction result.");
            }
        })
        .catch(() => alert("Something went wrong while recording your reaction."));
    }

    function submitComment() {
        const feedback = commentBox.value.trim();
        const reaction = feedbackForm.dataset.reaction;
        const submitBtn = document.getElementById("submitCommentBtn");
        const text = submitBtn.querySelector(".btn-text");
        const spinner = submitBtn.querySelector(".spinner");

        if (!feedback) {
            alert("Please add a comment.");
            return;
        }

        submitBtn.disabled = true;
        text.style.display = "none";
        spinner.style.display = "inline";

        fetch("{% url 'update_comment' %}", {
            method: "POST",
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                politician_id: politicianId,
                comment: feedback
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                setTimeout(() => {
                    loadNextPolitician();
                }, 1000);
            } else {
                alert("Failed to save comment.");
            }
        })
        .catch(() => {
            alert("Something went wrong. Try again.");
        })
        .finally(() => {
            submitBtn.disabled = false;
            text.style.display = "inline";
            spinner.style.display = "none";
        });
    }

    function loadNextPolitician() {
        window.location.href = "{% if next_politician %}{% url 'hug_or_slap' next_politician.id %}{% else %}{% url 'analytics_page' %}{% endif %}";
    }
</script>

{% endblock %}
